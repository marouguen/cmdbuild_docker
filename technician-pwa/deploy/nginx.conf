# Deployment template. Serve behind trusted HTTPS termination.
# Substitute the upstream for your network; do not expose this HTTP listener publicly.
map $uri $technician_cache_control {
    default "no-cache";
    ~^/assets/ "public, max-age=31536000, immutable";
    ~^/cmdbuild/services/rest/v3/ "no-store";
}
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 11m;

    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control $technician_cache_control always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location /cmdbuild/services/rest/v3/ {
        proxy_pass http://host.docker.internal:8091;
        proxy_set_header Host $proxy_host;
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Pragma;
        proxy_cache off;
        proxy_read_timeout 60s;
        access_log off;
    }
    location /cmdbuild/ { return 404; }
    location = /sw.js { try_files $uri =404; }
    location /assets/ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
